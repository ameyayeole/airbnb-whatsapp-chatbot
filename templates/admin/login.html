{% extends "admin/base.html" %}
{% block title %}Sign in · Mondys admin{% endblock %}
{% block content %}
<div style="max-width:420px; margin:60px auto;">
  <div class="card" style="padding:40px 36px;">
    <div style="font-family:'Caveat',cursive; font-size:26px; color:#B65C36;">welcome back</div>
    <h1 style="margin:4px 0 10px; font-size:38px;">Mondys<span style="color:#B65C36;">.</span> admin</h1>
    <p class="muted" style="margin:0 0 24px;">Sign in to manage bookings, settings &amp; photos.</p>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin.login') }}">
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" autofocus required>
      </div>
      <button class="btn primary" type="submit" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
