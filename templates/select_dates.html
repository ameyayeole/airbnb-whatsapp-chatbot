<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Dates – Farmhouse Goa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
    h1 { text-align: center; font-size: 1.3rem; color: #1a1a1a; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      color: #1a1a1a;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #25a244; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #25a244;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1e8a38; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .success { display: none; text-align: center; padding: 20px 0 0; }
    .success .tick { font-size: 3rem; margin-bottom: 12px; }
    .success h2 { color: #25a244; margin-bottom: 8px; }
    .success p { color: #555; font-size: 0.95rem; }
    .error-msg { color: #e53e3e; font-size: 0.85rem; margin-top: -12px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🌿</div>
  <h1>Farmhouse Goa</h1>
  <p class="subtitle">Select your check-in and check-out dates</p>

  <div id="form">
    <label>Check-in Date</label>
    <input type="text" id="checkin" placeholder="Select check-in date" readonly/>

    <label>Check-out Date</label>
    <input type="text" id="checkout" placeholder="Select check-out date" readonly/>
    <p class="error-msg" id="err"></p>

    <button class="btn" id="submitBtn" onclick="submitDates()">Confirm Dates</button>
  </div>

  <div class="success" id="success">
    <div class="tick">✅</div>
    <h2>Dates Confirmed!</h2>
    <p>Go back to WhatsApp to continue your booking.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  const phone = "{{ phone }}";

  const checkinPicker = flatpickr("#checkin", {
    minDate: "today",
    dateFormat: "Y-m-d",
    disableMobile: false,
    onChange: function(selected) {
      if (selected[0]) {
        const next = new Date(selected[0]);
        next.setDate(next.getDate() + 1);
        checkoutPicker.set("minDate", next);
        checkoutPicker.clear();
      }
    }
  });

  const checkoutPicker = flatpickr("#checkout", {
    minDate: "today",
    dateFormat: "Y-m-d",
    disableMobile: false,
  });

  function submitDates() {
    const ci  = document.getElementById("checkin").value;
    const co  = document.getElementById("checkout").value;
    const err = document.getElementById("err");

    if (!ci || !co) {
      err.style.display = "block";
      err.textContent = "Please select both dates.";
      return;
    }

    err.style.display = "none";
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Confirming...";

    fetch("/dates-selected", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, check_in: ci, check_out: co })
    })
    .then(r => r.json())
    .then(() => {
      document.getElementById("form").style.display = "none";
      document.getElementById("success").style.display = "block";
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Confirm Dates";
      err.style.display = "block";
      err.textContent = "Something went wrong. Please try again.";
    });
  }
</script>
</body>
</html>
